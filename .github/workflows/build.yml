name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-33 build-tools;36.0.0"

      - name: Build
        env:
          BUILD_TOOLS: "36.0.0"
        run: sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CleanLauncher-${{ github.sha }}
          path: build/CleanLauncher.apk
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/CleanLauncher.apk
          name: Versión ${{ github.ref_name }}
          draft: false
          prerelease: false
